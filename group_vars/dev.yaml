---
base_domain: "{{ cluster_name }}.dev-jupyter.stfc.ac.uk"
host_domain: "jupyter.{{ base_domain }}"
longhorn_ip: "130.246.83.115"
staging_cert: true

use_traefik: true

profiles:
  - profile1:
    display_name: "Default environment"
    description: "This is a simple default environment"
    default: true
    ram: "5G"
    image: jupyter/minimal-notebook
    node_groups: []
    gpu_required: false
    gpu_display_drivers: false
    # Please remove '-'s if no commands required
    commands:
      -
      -

# Set number of users per GPU
# Available profiles: users2, users3, users4
# users2 = 2 users per gpu, users3 = 3 users per gpu, etc.
# Example
#
# gpu_profiles:
#   - node_group: gpu
#     profile: users2
#   - node_group: gpu2
#     profile: users3

manila:
  required: false
  mount_path: "/home/jovyan/manila"
  share_name: new-cephfs-share-pvc

# One of ["shared_password", "iris_iam" or "keycloak"]:
# shared_password:
# Use the common authentication values below. All users share a password. All admins share another.

# keycloak:
# Use the common authentication values below, but deploy a Keycloak instance using additional settings below.
# Users/Admins are prompted to change their password ater first login

# iris_iam:
# Use the IRIS-IAM oauth service for authentication
authentication_method: "keycloak"

# These username/password options apply to shared_password and keycloak
common_authentication_values:
  # Passwords must be at least 32 characters for shared_password
  # For shared_password, these are permanent
  # For keycloak, these are temporary. Users/admins change them after first login
  admin_password:
  user_password:
  # This will be suffixed with "-1", "-2"...
  user_username_prefix:
  number_of_users:
  # These will be prefixed with "admin"
  admin_names:
    -
    -

keycloak:
  # Use traefik, or the loadbalancer IP's domain name
  domain: "keycloak.{{ base_domain }}"

  # Not used for Traefik
  loadBalancerIP:
  # A secret token for OIDC i.e. `openssl rand -hex 32`
  client_secret:
iris_iam:
  client_id:
  client_secret:
  admin_groups:
    -
    -
  allowed_groups:
    -
    -
