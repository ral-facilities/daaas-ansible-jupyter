---
- name: Install keycloak (Waits up to 10 minutes)
  kubernetes.core.helm:
    chart_ref: "{{ keycloak_chart_ref }}"
    chart_repo_url: "{{ keycloak_repo_url }}"
    release_name: "{{ keycloak_deployed_name }}"
    chart_version: "{{ keycloak_version }}"
    release_namespace: "{{ keycloak_namespace }}"
    create_namespace: true
    kubeconfig: "{{ kubeconfig_path }}"
    wait: true
    release_values: "{{ keycloak_values }}"
    timeout: "10m"

- name: Define auth dict for Keycloak modules
  ansible.builtin.set_fact:
    kc_auth:
      auth_keycloak_url: "{{ keycloak_defaults.url }}"
      auth_realm: "master"
      auth_username: "{{ keycloak_defaults.system_admin_username }}"
      auth_password: "{{ keycloak_defaults.system_admin_password }}"
      validate_certs: false

- name: Ensure target realm exists
  middleware_automation.keycloak.keycloak_realm:
    realm: "{{ keycloak_defaults.realm }}"
    enabled: true
    state: present
  args: "{{ kc_auth }}"

- name: Configure realm user profile (email / first / last name required or optional)
  middleware_automation.keycloak.keycloak_userprofile:
    parent_id: "{{ keycloak_defaults.realm }}"
    state: present
    config:
      kc_user_profile_config:
        - attributes:
            - "{{ deploy_keycloak_username_attr }}"
            - "{{ deploy_keycloak_email_attr | combine(deploy_keycloak_email_required) }}"
            - "{{ deploy_keycloak_first_name_attr | combine(deploy_keycloak_first_name_required) }}"
            - "{{ deploy_keycloak_last_name_attr | combine(deploy_keycloak_last_name_required) }}"
  vars:
    deploy_keycloak_perms: { view: [admin, user], edit: [admin, user] }
    deploy_keycloak_required: { required: { roles: [user] } }
    deploy_keycloak_email_required: "{{ deploy_keycloak_required if keycloak.require_email | bool else {} }}"
    deploy_keycloak_first_name_required: "{{ deploy_keycloak_required if keycloak.require_first_name | bool else {} }}"
    deploy_keycloak_last_name_required: "{{ deploy_keycloak_required if keycloak.require_last_name | bool else {} }}"
    deploy_keycloak_username_attr:
      name: username
      displayName: "${username}"
      validations:
        length: { min: 3, max: 255 }
        username_prohibited_characters: {}
        up_username_not_idn_homograph: {}
      permissions: "{{ deploy_keycloak_perms }}"
    deploy_keycloak_email_attr:
      name: email
      displayName: "${email}"
      validations:
        email: {}
        length: { max: 255 }
      permissions: "{{ deploy_keycloak_perms }}"
    deploy_keycloak_first_name_attr:
      name: firstName
      displayName: "${firstName}"
      validations:
        length: { max: 255 }
        person_name_prohibited_characters: {}
      permissions: "{{ deploy_keycloak_perms }}"
    deploy_keycloak_last_name_attr:
      name: lastName
      displayName: "${lastName}"
      validations:
        length: { max: 255 }
        person_name_prohibited_characters: {}
      permissions: "{{ deploy_keycloak_perms }}"
  args: "{{ kc_auth }}"

- name: Fetch existing Keycloak users to preserve idempotency
  middleware_automation.keycloak.keycloak_realm_users_info:
    realm: "{{ keycloak_defaults.realm }}"
  args: "{{ kc_auth }}"
  register: kc_existing_users_info

- name: Extract existing usernames
  ansible.builtin.set_fact:
    kc_existing_usernames: "{{ kc_existing_users_info.users | map(attribute='username') | list }}"

- name: Create default Groups in Keycloak
  middleware_automation.keycloak.keycloak_group:
    realm: "{{ keycloak_defaults.realm }}"
    name: "{{ deploy_keycloak_group_name }}"
    state: present
  args: "{{ kc_auth }}"
  loop: "{{ [keycloak_defaults.admin_group, keycloak_defaults.user_group] }}"
  loop_control:
    loop_var: deploy_keycloak_group_name

- name: Assign Keycloak realm-admin role to admin group
  middleware_automation.keycloak.keycloak_client_rolemapping:
    realm: "{{ keycloak_defaults.realm }}"
    group_name: "{{ keycloak_defaults.admin_group }}"
    client_id: "realm-management"
    roles:
      - name: "realm-admin"
    state: present
  args: "{{ kc_auth }}"

- name: Create 'groups' client scope
  middleware_automation.keycloak.keycloak_client_scope:
    realm: "{{ keycloak_defaults.realm }}"
    name: "groups"
    protocol: openid-connect
    description: "Scope for user groups"
    protocol_mappers:
      - name: "group-mapper"
        protocol: openid-connect
        protocolMapper: oidc-group-membership-mapper
        config:
          claim.name: "{{ keycloak_defaults.claim_groups_key | default('groups') }}"
          full.path: "false"
          id.token.claim: "true"
          access.token.claim: "true"
          userinfo.token.claim: "true"
    state: present
  args: "{{ kc_auth }}"

- name: Create JupyterHub OpenID Client with Groups Mapper
  middleware_automation.keycloak.keycloak_client:
    realm: "{{ keycloak_defaults.realm }}"
    client_id: "{{ keycloak_defaults.client_id }}"
    client_authenticator_type: client-secret
    secret: "{{ keycloak.client_secret }}"
    public_client: false
    direct_access_grants_enabled: true
    standard_flow_enabled: true
    redirect_uris:
      - "https://{{ host_domain }}/hub/oauth_callback"
    default_client_scopes:
      - profile
      - roles
      - email
      - groups
    state: present
  args: "{{ kc_auth }}"

- name: Create Batch Admin Users
  middleware_automation.keycloak.keycloak_user:
    realm: "{{ keycloak_defaults.realm }}"
    username: "admin-{{ deploy_keycloak_admin_name }}"
    enabled: true
    credentials: >-
      {{
        omit
        if ('admin-' ~ deploy_keycloak_admin_name) in kc_existing_usernames
        else [{
          'type': 'password',
          'value': common_authentication_values.admin_password,
          'temporary': true
        }]
      }}
    required_actions: >-
      {{
        omit
        if ('admin-' ~ deploy_keycloak_admin_name) in kc_existing_usernames
        else ['UPDATE_PASSWORD']
      }}
    groups:
      - name: "{{ keycloak_defaults.admin_group }}"
      - name: "{{ keycloak_defaults.user_group }}"
    state: present
  args: "{{ kc_auth }}"
  loop: "{{ common_authentication_values.admin_names }}"
  loop_control:
    loop_var: deploy_keycloak_admin_name

- name: Create Batch Standard Users
  middleware_automation.keycloak.keycloak_user:
    realm: "{{ keycloak_defaults.realm }}"
    username: >-
      {{
        (common_authentication_values.user_username_prefix | default('user'))
      }}-{{ deploy_keycloak_user_index }}
    enabled: true
    credentials: >-
      {{
        omit
        if (
          (common_authentication_values.user_username_prefix | default('user'))
          ~ '-'
          ~ deploy_keycloak_user_index
        ) in kc_existing_usernames
        else [{
          'type': 'password',
          'value': common_authentication_values.user_password,
          'temporary': true
        }]
      }}
    required_actions: >-
      {{
        omit
        if (
          (common_authentication_values.user_username_prefix | default('user'))
          ~ '-'
          ~ deploy_keycloak_user_index
        ) in kc_existing_usernames
        else ['UPDATE_PASSWORD']
      }}
    groups:
      - name: "{{ keycloak_defaults.user_group }}"
    state: present
  args: "{{ kc_auth }}"
  loop: "{{ range(1, (common_authentication_values.number_of_users | int) + 1) | list }}"
  loop_control:
    loop_var: deploy_keycloak_user_index
